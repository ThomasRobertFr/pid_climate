reload:
  name: Reload
  description: >-
    Re-read the pid_climate blocks from configuration.yaml and apply any changes,
    without restarting Home Assistant. Rooms whose config is unchanged are left
    running; only edited ones reload, losing their integral and hold state.

set_integral:
  name: Set integral
  description: >-
    Force the integral term for one mode. Mostly a diagnostic escape hatch --
    if you need it regularly, the mode's `offset` is wrong.
  target:
    entity:
      integration: pid_climate
      domain: climate
  fields:
    value:
      name: Value
      description: Integral value, in degrees of command.
      required: true
      selector:
        number:
          min: -10
          max: 10
          step: 0.1
          mode: box
    mode:
      name: Mode
      description: Which mode's integral to set. Defaults to the active mode.
      selector:
        select:
          options:
            - heat
            - cool

reset_integral:
  name: Reset integral
  description: Zero the integral for one mode, or for all modes if none is given.
  target:
    entity:
      integration: pid_climate
      domain: climate
  fields:
    mode:
      name: Mode
      description: Which mode's integral to reset. Defaults to all modes.
      selector:
        select:
          options:
            - heat
            - cool

clear_hold:
  name: Clear hold
  description: >-
    Drop any outstanding target-change hold so integration resumes immediately,
    instead of waiting out the remaining time.
  target:
    entity:
      integration: pid_climate
      domain: climate
  fields:
    mode:
      name: Mode
      description: Which mode's hold to clear. Defaults to all modes.
      selector:
        select:
          options:
            - heat
            - cool
